name: birddog

# BirdDog local development topology.
# All application processes and tests run in containers.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-birddog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birddog}
      POSTGRES_DB: ${POSTGRES_DB:-birddog}
    ports:
      - "${DB_PORT:-22543}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birddog} -d ${POSTGRES_DB:-birddog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: birddog-backend:dev
    build:
      context: ./apps/backend
      target: development
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-birddog}:${POSTGRES_PASSWORD:-birddog}@db:5432/${POSTGRES_DB:-birddog}
      APP_ENV: development
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./apps/backend:/app
    ports:
      - "${API_PORT:-22800}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    image: birddog-backend:dev
    build:
      context: ./apps/backend
      target: development
    working_dir: /app
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-birddog}:${POSTGRES_PASSWORD:-birddog}@db:5432/${POSTGRES_DB:-birddog}
      APP_ENV: development
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 17 * * *}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./apps/backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: birddog-frontend:dev
    build:
      context: ./apps/frontend
      target: development
    working_dir: /app
    command: ["pnpm", "dev"]
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${WEB_PORT:-22300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
  frontend_next:
