[project]
name = "birddog-backend"
version = "0.1.0"
description = "BirdDog API and scheduled worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "fastapi>=0.116,<1",
  "pgeocode>=0.5,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.26,<2",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests requiring the Docker Compose database",
  "external_worker: smoke tests requiring the running Docker Compose worker",
]

[tool.uv]
package = false
