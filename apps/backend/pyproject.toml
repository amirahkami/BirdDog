[project]
name = "birddog-backend"
version = "0.1.0"
description = "BirdDog API and scheduled worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
